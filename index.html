function parse(t){try{return JSON.parse(t)}catch(e){}var m=t.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)try{return JSON.parse(m[1])}catch(e){}var a=t.search(/[\[{]/),z=Math.max(t.lastIndexOf("]"),t.lastIndexOf("}"));if(a>-1&&z>a)try{return JSON.parse(t.slice(a,z+1))}catch(e){}throw {code:"invalid_json",message:"Не вдалося розібрати відповідь",text:t}}

<script>
