<script>
(function(){
function toJpeg(b){return createImageBitmap(b).then(function(bm){var k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement("canvas");c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);return new Promise(function(r,j){c.toBlob(function(x){x?r(x):j()},"image/jpeg",.85)})}).catch(function(){throw {code:"image_rejected",message:"Не вдалося прочитати фото. Спробуйте JPEG або PNG."}})}

var j=await r.json().catch(function(){return{}});if(!r.ok)throw {code:"api_"+r.status,message:"Помилка API ("+r.status+"): "+((j.error&&j.error.message)||"невідомо")};
return(j.content||[]).map(function(c){return c.text||""}).join("")}

'<div class="cards"><div class="c"><small>Дохід за поточний місяць</small><b class="i">'+money(c.i)+'</b>'+dl(c.i,p.i)+'</div><div class="c"><small>Витрати</small><b class="e">'+money(c.e)+'</b>'+dl(c.e,p.e,1)+'</div><div class="c"><small>Прибуток</small><b class="'+(c.i-c.e<0?"e":"i")+'">'+money(c.i-c.e)+'</b></div></div>'+

function body(t,l,sum){var o=SRT[t]||{},gm=o.gm||(o.g?"c":"");if(!gm)return l.map(function(x){return row(x,1)}).join("");

function nrm(s){return String(s||"").toLowerCase().replace(/[^0-9a-zа-яіїєґ]+/g," ").trim()}
function tcs(){return Object.keys(DOCS).filter(function(k){return k.indexOf("sk:t:")===0&&!DOCS[k].del}).map(function(k){return Object.assign({id:k.slice(5)},DOCS[k])}).sort(function(a,b){return a.n.localeCompare(b.n,"uk")})}
function tcCost(t){var c=0,miss=0;(t.ing||[]).forEach(function(x){var i=itemById(x.i);if(!i||!(i.p>0))miss++;else c+=x.q*i.p});return{c:c,miss:miss}}
function tcFind(name){var n=nrm(name),L=tcs();for(var k=0;k<L.length;k++){if(nrm(L[k].n)===n)return L[k];var al=String(L[k].al||"").split(";");for(var j=0;j<al.length;j++)if(al[j].trim()&&nrm(al[j])===n)return L[k]}return null}

 var ids=["sk:i:"+iid],mid="sk:m:"+pid.slice(5);DOCS[mid]={k:p.m,i:iid,q:p.q,r:p.r||"",w:p.w||"",b:p.b||"",ts:p.ts,d:p.d};ids.push(mid);
 DOCS[pid]=Object.assign({},p,{done:1});ids.push(pid);saveMany(ids);pubLater();render();toast("Створено товар «"+p.nm+"». Додайте ціну й мінімум у картці.")}

/* ---- акції ---- */
function promos(){return Object.keys(DOCS).filter(function(k){return k.indexOf("pr:p:")===0&&!DOCS[k].del}).map(function(k){return Object.assign({id:k},DOCS[k])})}
function chainsCustom(){var c=DOCS["pr:cfg"];return c&&c.chains?c.chains:[]}
function chainNames(){return CH0.filter(function(c){return c.t==="chain"}).map(function(c){return c.n}).concat(chainsCustom().map(function(c){return c.n}))}
function base(price,q,u){
 if(!(price>0))return null;var k=q>0?q:1;
 if(u==="г")return{v:price/k*1000,b:"кг"};if(u==="кг")return{v:price/k,b:"кг"};
 if(u==="мл")return{v:price/k*1000,b:"л"};if(u==="л")return{v:price/k,b:"л"};
 return{v:price/k,b:u==="пак"?"пак":"шт"}}
function proH(){
 var dt=new Date();dt.setDate(dt.getDate()+7);var until=dt.toLocaleDateString("sv");
 var h='<h2 style="margin-top:0">Де дивитися акції в Кропивницькому</h2><p class="sub">Ціни з сайтів тут автоматично не підтягуються. Відкрийте каталог, знайдіть вигідну позицію й додайте її в трекер нижче: програма порівняє акцію з вашою ціною закупівлі.</p>';

 h+='<h2>Сайти мереж</h2><p class="sub">Чи є магазин мережі в місті, перевіряйте на сайті мережі або в каталогах вище.</p><div class="row">'+CH0.filter(function(c){return c.t==="chain"}).concat(chainsCustom().map(function(c){return{n:c.n,u:c.u,x:1}})).map(function(c){return '<a class="b g" href="'+E(c.u)+'" target="_blank" rel="noopener" style="text-decoration:none">'+E(c.n)+' ↗</a>'+(c.x?'<button class="b g" data-chdel="'+E(c.n)+'" aria-label="Прибрати мережу">✕</button>':"")}).join("")+'</div><div class="row"><input id="prchn" placeholder="Назва мережі" style="width:10em"><input id="prchu" placeholder="https://…" style="flex:1;min-width:10em"><button class="b g" id="prchadd">+ Додати мережу</button></div>';

 h+='<div class="row"><input id="prp" inputmode="decimal" placeholder="Ціна, '+E(CFG.cur)+'" style="width:8em"><input id="prq" inputmode="decimal" placeholder="Фасування" style="width:7em"><select id="pru">'+UN.map(function(u){return '<option>'+u+'</option>'}).join("")+'</select><label class="sub">діє до <input id="prd" type="date" value="'+until+'"></label><button class="b" id="pradd">Додати</button></div>';
 h+='<div class="row"><label class="b g" style="cursor:pointer">📷 Розпізнати листівку або скріншот<input id="prfly" type="file" accept="image/*" multiple hidden></label><span class="sub">Мережа береться з поля вище. Потрібен ключ Claude API у Налаштуваннях.</span></div>';
 var now=today(),show=g("prold")&&g("prold").checked,list=promos().filter(function(p){return show||!p.until||p.until>=now}).map(function(p){
  var it=p.item?itemById(p.item):items().filter(function(i){return i.n.toLowerCase()===String(p.n).toLowerCase()})[0],b=base(p.pr,p.q,p.u),cmp=null;
  if(b&&it&&it.p>0){var ib=base(it.p,1,it.u);if(ib&&ib.b===b.b)cmp={mine:ib.v,pc:(b.v-ib.v)/ib.v*100,b:b.b}}
  return{p:p,b:b,cmp:cmp,exp:p.until&&p.until<now}}).sort(function(a,c){var x=a.cmp?a.cmp.pc:999,y=c.cmp?c.cmp.pc:999;return x-y||String(a.p.until||"").localeCompare(String(c.p.until||""))});
 h+='<h2>Трекер акцій</h2><div class="row"><label class="sub"><input type="checkbox" id="prold"'+(show?" checked":"")+'> показати прострочені</label></div>';
 if(!list.length)h+='<div class="note">Акційних позицій немає. Додайте першу вище.</div>';
 else h+='<div class="tw"><table><thead><tr><th>Товар</th><th>Мережа</th><th>Ціна</th><th>За одиницю</th><th>Ваша ціна</th><th>Різниця</th><th>Діє до</th><th></th></tr></thead><tbody>'+list.map(function(r){var p=r.p;
  return '<tr'+(r.exp?' style="opacity:.5"':"")+'><td>'+E(p.n)+(p.q>0?'<br><small class="sub">'+fm(p.q)+" "+E(p.u)+'</small>':"")+'</td><td>'+E(p.ch)+'</td><td>'+mny(p.pr)+'</td><td>'+(r.b?mny(r.b.v)+" / "+r.b.b:"—")+'</td><td>'+(r.cmp?mny(r.cmp.mine)+" / "+r.cmp.b:"—")+'</td><td'+(r.cmp?(r.cmp.pc<=-5?' class="i"':r.cmp.pc>=5?' class="e"':""):"")+'>'+(r.cmp?(r.cmp.pc>0?"+":"")+fm(r.cmp.pc,0)+"%":"—")+'</td><td>'+(p.until?dm(p.until):"—")+'</td><td><button class="b g" data-prdel="'+E(p.id)+'" aria-label="Видалити">✕</button></td></tr>'}).join("")+'</tbody></table></div><p class="sub">Різниця рахується, коли для товару в каталозі склада вказана ціна за одиницю й одиниці співставні (кг, л чи шт). Зелений: дешевше за вашу ціну щонайменше на 5%.</p>';
 return h}
function renderPr(){var el=g("pr");if(!el)return;if(el.hidden&&tabNow()!=="pr")return;
 var a=document.activeElement,fid=a&&a.id&&el.contains(a)?a.id:"",vals={};["prn","prc","prp","prq","pru","prd","prchn","prchu"].forEach(function(i){if(g(i))vals[i]=g(i).value});
 el.innerHTML=proH();Object.keys(vals).forEach(function(i){if(g(i)&&vals[i]!==""&&i!=="prd")g(i).value=vals[i]});if(vals.prd&&g("prd"))g("prd").value=vals.prd;if(fid&&g(fid))g(fid).focus()}
function addPromo(o){var id="pr:p:"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);DOCS[id]=o;return id}
function prAdd(){
 var n=g("prn").value.trim().slice(0,80),pr=num(g("prp").value),q=g("prq").value.trim()===""?0:num(g("prq").value);
 if(!n){g("prn").focus();return}if(!(pr>0)){g("prp").focus();toast("Вкажіть ціну акції");return}if(!(q>=0)){g("prq").focus();return}
 var it=items().filter(function(i){return i.n.toLowerCase()===n.toLowerCase()})[0],o={n:n,ch:g("prc").value,pr:pr,q:q,u:g("pru").value,until:g("prd").value||"",ts:Date.now()};if(it)o.item=it.id;
 var id=addPromo(o);persist(id,o);g("prn").value="";g("prp").value="";g("prq").value="";renderPr();toast("Акцію додано")}
async function flyer(files){
 if(flyBusy)return;flyBusy=1;
 try{toast("Готую розпізнавання…",0,1);var Ev=await env();
  if(!Ev.rt){g("toast").hidden=true;showErr("Розпізнавання не працює у збереженому чи експортованому файлі.\nВідкрийте додаток за посиланням у вашому акаунті claude.ai.");flyBusy=0;return}
  if(!Ev.sm){g("toast").hidden=true;showErr("Claude недоступний у цьому вікні.");flyBusy=0;return}
  SMP=Ev.sm;var ch=g("prc").value,added=0,ids=[];
  for(var i=0;i<files.length;i++){toast("Розпізнаю "+(i+1)+" з "+files.length+"… (до хвилини)",0,1);
   try{var r=await recog(files[i],"Це фото або скріншот акційної листівки чи сторінки акцій магазину в Україні. Витягни акційні товари й поверни ЛИШЕ JSON без пояснень: {\"items\":[{\"name\":\"назва товару як на листівці\",\"price\":число (акційна ціна за упаковку в гривнях, крапка як роздільник),\"qty\":число (вага чи об'єм упаковки, або null),\"unit\":\"кг|г|л|мл|шт|null\",\"until\":\"YYYY-MM-DD або null\"}]}. Не вигадуй: якщо ціни не видно, пропусти товар. Сьогодні "+today()+".");
    (r&&r.items||[]).forEach(function(x){var pr=num(x.price);if(!x||!x.name||!(pr>0))return;var q=num(x.qty);
     var o={n:String(x.name).slice(0,80),ch:ch,pr:pr,q:q>0?q:0,u:UN.indexOf(x.unit)>-1?x.unit:"шт",until:/^\d{4}-\d{2}-\d{2}$/.test(x.until||"")?x.until:"",ts:Date.now()};
     ids.push(addPromo(o));added++})}
   catch(e){g("toast").hidden=true;showErr("Не вдалося розпізнати: "+((e&&e.message)||"помилка")+"\nФайл: "+files[i].name)}}
  if(ids.length)saveMany(ids);renderPr();toast(added?"З листівки додано акцій: "+added+". Перевірте ціни.":"Нічого не розпізнано")
 }catch(e){g("toast").hidden=true;showErr("Листівка: "+((e&&e.message)||"помилка"))}
 flyBusy=0}
